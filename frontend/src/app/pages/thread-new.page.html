<div class="mx-auto max-w-2xl px-4 py-8">
  <a routerLink="/" class="text-sm text-brand-600 hover:underline">← Volver al feed</a>
  <h1 class="mt-4 text-2xl font-bold text-slate-900 dark:text-white">Nueva discusión</h1>
  <p class="mt-1 text-sm text-slate-500">Comparte una pregunta o tema con la comunidad.</p>

  <form (ngSubmit)="submit()" class="card mt-6 space-y-4 p-6">
    <div>
      <label class="mb-1 block text-sm font-medium">Categoría</label>
      <select [(ngModel)]="categoryId" name="categoryId" class="input-field" required>
        @for (cat of categories; track cat.id) {
          <option [ngValue]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium">Título</label>
      <input [(ngModel)]="title" name="title" class="input-field" placeholder="¿De qué quieres hablar?" required maxlength="255" />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium">Contenido</label>
      <app-markdown-editor [(value)]="body" placeholder="Describe tu hilo con detalle..." />
    </div>

    @if (error) {
      <p class="text-sm text-red-600 dark:text-red-400">{{ error }}</p>
    }

    <button type="submit" class="btn-primary w-full" [disabled]="loading || !title.trim() || !body.trim()">
      {{ loading ? 'Publicando...' : 'Publicar hilo' }}
    </button>
  </form>
</div>
